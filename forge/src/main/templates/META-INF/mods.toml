modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "neroeconomy_logo.png"
description = '''
NeroEconomy - multiloader build (Forge).
'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "nerolandcore"
mandatory = true
versionRange = "${nerolandcore_version_range}"
ordering = "AFTER"
side = "BOTH"

# Optional siblings use ordering = "NONE": NeroEconomy is the API provider and only checks
# isModLoaded() at runtime, while siblings (NeroSpace, NeroLogistics, ...) declare ordering = "AFTER"
# on neroeconomy. Ordering AFTER them here creates a load-order cycle that stops the game starting.
[[dependencies.${mod_id}]]
modId = "nerologistics"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "nerofactions"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neroevents"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neroquests"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "nerocreatures"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"
