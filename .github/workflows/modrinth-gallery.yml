name: Sync Modrinth gallery

# Mirrors the tracked gallery screenshots to the Modrinth project gallery whenever they change.
# Modrinth has a gallery API (unlike CurseForge — the CurseForge gallery stays a manual web
# upload). To keep the gallery an exact mirror of the repo folder, this wipes the existing gallery
# and re-uploads every PNG in a fixed order, featuring the first as the card.
#
# Source of truth: the capture harness's output folder,
# neoforge/versions/26.2/runs/client/screenshots/neroeconomy/*.png — TRACKED files (the run tree is
# ignored except for this one leaf; see the whitelist at the bottom of .gitignore). Produce them with
# `/neroeconomy gallery` + `/necgallery capture`, shrink them with `./gradlew compressScreenshots`,
# then commit. The folder starts out empty; with no PNGs the job exits cleanly with a notice instead
# of failing, so the workflow is quiet until real screenshots land.
# Requires the same secrets as the description sync: MODRINTH_PROJECT_ID + MODRINTH_API_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - neoforge/versions/26.2/runs/client/screenshots/neroeconomy/**
      - .github/workflows/modrinth-gallery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Mirror gallery to Modrinth
    runs-on: ubuntu-latest
    env:
      MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
      MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
      UA: "Neroland/neroeconomy-ci (dario@neroland.co.za)"
      DIR: neoforge/versions/26.2/runs/client/screenshots/neroeconomy
      # Gallery order; the first present file becomes the featured card. These are exactly the four
      # shot names GalleryCaptureHarness.buildShots emits — keep the two in step. Any PNG not listed
      # here is appended afterwards in alphabetical order, so new shots still sync without editing this.
      ORDER: "bank_terminal player_shop trading_terminal market_board"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python (for image resizing)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Mirror screenshots to the Modrinth gallery
        run: |
          set -euo pipefail
          # No screenshots yet is a normal state, not a failure: skip quietly.
          if ! ls "$DIR"/*.png >/dev/null 2>&1; then
            echo "::notice::No PNGs in $DIR — nothing to sync; skipping."
            exit 0
          fi
          if [ -z "$MODRINTH_PROJECT_ID" ] || [ -z "$MODRINTH_API_TOKEN" ]; then
            echo "::error::MODRINTH_PROJECT_ID / MODRINTH_API_TOKEN secret missing."
            exit 1
          fi
          API="https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_ID}"

          # Curated titles + descriptions per shot. Any shot not listed here falls back to a
          # prettified filename + a generic description, so new captures still sync cleanly.
          declare -A TITLE=(
            [bank_terminal]="Bank Terminal"
            [player_shop]="Player Shop"
            [trading_terminal]="Trading Terminal"
            [market_board]="Market Board"
          )
          declare -A DESC=(
            [bank_terminal]="The Bank Terminal: check your credit balance, pay another player, and collect proceeds owed to you."
            [player_shop]="An owned Player Shop with per-item pricing, still selling while its owner is offline."
            [trading_terminal]="The Trading Terminal searching live server listings, with prices re-checked at execution."
            [market_board]="A Market Board carrying escrowed sell offers and standing buy offers from across the server."
          )

          # Build the ordered file list: preferred names first (if present), then any remaining PNGs.
          # (if/then, not `test && cmd`, so a missing preferred shot doesn't trip `set -e`.)
          mapfile -t files < <(
            for name in $ORDER; do
              if [ -f "$DIR/$name.png" ]; then echo "$DIR/$name.png"; fi
            done
            for f in $(ls "$DIR"/*.png | sort); do
              base=$(basename "$f" .png)
              case " $ORDER " in *" $base "*) ;; *) echo "$f" ;; esac
            done
          )
          echo "Syncing ${#files[@]} image(s): ${files[*]}"

          # 1. Wipe the existing gallery so the result is an exact mirror of the repo folder.
          curl -sS -H "User-Agent: $UA" -H "Authorization: $MODRINTH_API_TOKEN" "$API" \
            | jq -r '.gallery[].url' \
            | while read -r url; do
                if [ -z "$url" ]; then continue; fi
                enc=$(jq -rn --arg u "$url" '$u|@uri')
                echo "Deleting gallery item: $url"
                curl -sS -X DELETE -H "User-Agent: $UA" -H "Authorization: $MODRINTH_API_TOKEN" \
                  "$API/gallery?url=$enc"
              done

          # 2. Upload each file: ordered, first one featured. Title + description from the maps above.
          # Modrinth caps gallery images at 5 MiB but raw screenshots are 6–8 MiB PNGs, so upload a
          # web copy: cap width at 1920px and recompress to JPEG q88 (visually lossless for screenshots,
          # well under the cap). Uses Python+Pillow (installed above) — robust vs the runner missing
          # ImageMagick/ffmpeg. The repo keeps the full-res PNGs for the CurseForge gallery.
          i=0
          for f in "${files[@]}"; do
            base=$(basename "$f" .png)
            title=${TITLE[$base]:-$(echo "$base" | sed -E 's/[-_]/ /g; s/\b(.)/\u\1/g')}
            desc=${DESC[$base]:-"A scene from the NeroEconomy player-economy mod."}
            tenc=$(jq -rn --arg t "$title" '$t|@uri')
            denc=$(jq -rn --arg d "$desc" '$d|@uri')
            featured=false
            if [ "$i" -eq 0 ]; then featured=true; fi
            up="$RUNNER_TEMP/$base.jpg"
            python -c "import sys; from PIL import Image; s,d=sys.argv[1],sys.argv[2]; im=Image.open(s).convert('RGB'); w,h=im.size; im=(im.resize((1920,round(h*1920/w)),Image.LANCZOS) if w>1920 else im); im.save(d,'JPEG',quality=88,optimize=True)" "$f" "$up"
            code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST \
              -H "User-Agent: $UA" -H "Authorization: $MODRINTH_API_TOKEN" -H "Content-Type: image/jpeg" \
              --data-binary @"$up" \
              "$API/gallery?ext=jpg&featured=$featured&title=$tenc&description=$denc&ordering=$i")
            if [ "$code" != "204" ]; then
              echo "::error::Upload of $f failed (HTTP $code)"; cat resp.txt; exit 1
            fi
            echo "Uploaded $f as $(du -h "$up" | cut -f1) JPEG (featured=$featured, ordering=$i, title=\"$title\")"
            i=$((i + 1))
          done
          echo "Modrinth gallery synced: $i image(s)."
